/* ---------- time ---------- */
const now=()=>(!S.live&&S.cfg.demoNow)?+new Date(S.cfg.demoNow):Date.now();
const iso=t=>new Date(t).toISOString();
const w=t=>new Date(+new Date(t)+TZ);
const MON=m=>(S.lang==='id'?'Jan Feb Mar Mei Jun Jul Agu Sep Okt Nov Des':'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec').split(' ')[m];
const p2=n=>String(n).padStart(2,'0');
const fD=t=>{const d=w(t);return d.getUTCDate()+' '+MON(d.getUTCMonth())};
const fT=t=>{const d=w(t);return fD(t)+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
const dayKey=t=>w(t).toISOString().slice(0,10);
const mtd=t=>dayKey(t).slice(0,7)===dayKey(now()).slice(0,7)&&+new Date(t)<=now();
const today=t=>dayKey(t)===dayKey(now());
/* business hours between two moments: Mon-Fri 08:00-17:00 WIB */
function biz(a,b){a=+new Date(a)+TZ;b=+new Date(b)+TZ;if(!(b>a))return 0;let t=0;for(let d=Math.floor(a/D)*D;d<b;d+=D){const wd=new Date(d).getUTCDay();if(wd===0||wd===6)continue;const s=Math.max(a,d+8*H),e=Math.min(b,d+17*H);if(e>s)t+=e-s}return t/H}
function addBizDays(t,n){let d=+new Date(t);while(n>0){d+=D;const wd=w(d).getUTCDay();if(wd!==0&&wd!==6)n--}return d}
const hrs=h=>h<1?Math.max(1,Math.round(h*60))+' '+T('m'):h<9?h.toFixed(1)+' '+T('h'):(h/9).toFixed(1)+' '+T('d');
const rp=n=>'Rp '+Math.round(n||0).toLocaleString(S.lang==='id'?'id-ID':'en-US');
const rpS=n=>!n?'Rp 0':n>=1e9?'Rp '+(n/1e9).toFixed(1)+' '+T('bn'):'Rp '+Math.round(n/1e6)+' '+T('m ');
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';

/* ---------- rules ---------- */
const score=e=>Math.max(0,Math.min(100,KYC.reduce((s,[k,,p])=>s+(e.kyc&&e.kyc[k]?p:0),0)-10*(e.redFlags||0)));
const tier=e=>{if(e.priceCheck)return'P';const s=score(e);return s>=70?'A':s>=40?'B':'C'};
const tOrd={A:0,B:1,C:2,P:3};
const isOpen=e=>OPEN.includes(e.status);
function sla(e){const n=now();
 if(e.status==='New'){const h=biz(e.received,n);return h>SLA.reassign?{k:'reassign',t:T('No contact for ')+hrs(h),bad:1}:h>SLA.contact?{k:'breach',t:T('No contact for ')+hrs(h),bad:1}:{k:'ok',t:T('Contact within ')+hrs(SLA.contact-h)}}
 if(e.status==='No response'){const d=(n-+new Date(e.lastUpdate))/D;return d>=SLA.lost?{k:'autolost',t:T('Silent ')+Math.floor(d)+T(' days'),bad:1}:{k:'ok',t:T('Auto-lost in ')+Math.ceil(SLA.lost-d)+T(' days')}}
 if(isOpen(e)){const h=biz(e.lastUpdate,n);if(e.stage==='Quote sent')return h>SLA.follow?{k:'followup',t:T('Daily follow-up due'),bad:1}:{k:'ok',t:T('Follow-up logged')};return h>SLA.update?{k:'overdue',t:T('Status update ')+hrs(h-SLA.update)+T(' late'),bad:1}:{k:'ok',t:T('Update due in ')+hrs(SLA.update-h)}}
 return{k:'closed',t:''}}
function rst(r){const n=now();
 if(r.status==='pending')return{b:'open',t:T('Urgent: waiting for RM'),cls:'warn'};
 if(r.status==='sent'){const h=biz(r.sentAt,n);return h>SLA.nofb?{b:'open',nofb:1,rm:h>SLA.rmflag,h,t:T('No feedback for ')+hrs(h),cls:'bad'}:{b:'open',h,t:T('Awaiting accept'),cls:'warn'}}
 if(r.status==='accepted')return n>+new Date(r.due)?{b:'late',t:T('Late, was due ')+fD(r.due),cls:'bad'}:{b:'open',t:T('In progress, due ')+fD(r.due),cls:'ok'};
 return{b:'done',t:r.status==='returned'?T('Handed back'):r.status==='rejected'?T('Rejected'):T('Redirected to catalog'),cls:''}}
const digits=s=>String(s||'').replace(/\D/g,'').replace(/^62/,'0');
const sameCust=(a,b)=>{const ea=(a.email||'').toLowerCase(),eb=(b.email||'').toLowerCase();if(ea&&ea===eb)return true;const pa=digits(a.phone),pb=digits(b.phone);if(pa.length>6&&pa===pb)return true;const ca=(a.customer||'').trim().toLowerCase(),cb=(b.customer||'').trim().toLowerCase();return!!ca&&ca===cb};
function mint(region,seller,t){const k=dayKey(t),yy=k.slice(2,4);let n=0;for(const e of S.enq.values()){const m=/^ENQ-([A-Z]+)-[A-Z]+-(\d{2})\d{4}-(\d+)$/.exec(e.enqNo||'');if(m&&m[1]===region&&m[2]===yy)n=Math.max(n,+m[3])}return`ENQ-${region}-${seller}-${k.slice(2).replace(/-/g,'')}-${String(n+1).padStart(4,'0')}`}

 apprPO(d){upE(d.id,x=>{x.stage='WO / Kickoff'},'PO package approved by RM. Work order and kickoff requested from Sales Support.');const e=S.enq.get(d.id),id=nid('r'),n=iso(now());put('requests',{id,enqId:e.id,enqNo:e.enqNo,dept:'Sales Support',seller:e.seller,region:e.region,title:'Work order and kickoff meeting',urgent:false,status:'sent',sentAt:n,nudges:0,log:[{t:n,who:actor(),text:'Work order and kickoff requested after RM approval.'}]})},
 rAccept(d){const r=S.req.get(d.id);upR(d.id,x=>{x.status='accepted';x.acceptedAt=iso(now());x.due=iso(addBizDays(now(),DEPTS[r.dept].days))},`Accepted by ${r.dept}. Due in ${DEPTS[r.dept].days} business day(s).`)},
 rReturn(d){const r=S.req.get(d.id);form(T('Hand back to sales'),[{k:'note',label:'What you are handing back (drawing, price, schedule, answer)',type:'area',req:1}],v=>{upR(d.id,x=>{x.status='returned';x.returnedAt=iso(now())},'Handed back: '+v.note);const e=S.enq.get(r.enqId);if(e)upE(e.id,null,r.dept+' handed back: '+v.note,false)},null,T('Hand back'))},
 rReject(d){form(T('Reject this request'),[{k:'reason',label:'Reason',type:'select',opts:['Unclear request','Missing information','Unrealistic timeline','Not in scope']},{k:'note',label:'What sales must fix',type:'area',req:1}],v=>{upR(d.id,x=>{x.status='rejected';x.reason=v.reason;x.returnedAt=iso(now())},`Rejected (${v.reason}): ${v.note}`)},null,T('Reject'))},
 rRedirect(d){upR(d.id,x=>{x.status='redirected';x.returnedAt=iso(now())},'Redirected to the drawing catalog: a standard design fits.')},
 rNudge(d){upR(d.id,x=>{x.nudges=(x.nudges||0)+1},'Nudge sent: please confirm status.');toast(T('Nudge logged'))},
 rLog(d){const r=S.req.get(d.id);openM(r.dept+' request · '+r.enqNo,`<p style="margin-top:0">${esc(r.title)} <span class="pill ${rst(r).cls||'mute'}">${esc(rst(r).t)}</span></p>${log(r.log,20)}`)},
 qAdd(){const c=$('#qCat').value;if(c){S.q.lines.push({cat:c,qty:1});draw()}},
 qDel(d){S.q.lines.splice(+d.n,1);draw()},
 qSave(){const q=S.q,e=S.enq.get(q.enqId);if(!e)return toast(T('Choose an enquiry first'));if(!q.lines.length)return toast(T('Add at least one line'));const lines=q.lines.map(l=>{const c=S.cat.get(l.cat);return{item:c.item,qty:l.qty,price:c.price}}),total=lines.reduce((s,l)=>s+l.qty*l.price,0),rev=(e.quote?e.quote.rev:0)+1;
  upE(e.id,x=>{x.quote={tpl:q.tpl,rev,lines,total};x.stage='Quote sent';x.status='Ongoing';if(!x.contactedAt)x.contactedAt=iso(now())},`Quotation rev.${rev} (${q.tpl}) sent: ${rp(total)}.`);S.q={enqId:'',tpl:'Sale',lines:[]};toast(T('Quotation saved and marked as sent'))}
};
function createEnq(v,linked){const p=P[v.seller],t=now(),id=nid('e'),enqNo=mint(p.region,p.code,t),n=iso(t);
 const e={id,enqNo,received:n,lastUpdate:n,source:v.source,customer:v.customer,contact:v.contact,phone:v.phone,email:v.email,line:v.line,type:v.type,product:v.product,location:v.location,qty:v.qty,region:p.region,seller:p.code,firstOwner:p.code,status:'New',stage:'New',redFlags:0,kyc:{identity:!!(v.customer&&v.contact&&(v.phone||v.email)),need:!!v.product,qty:!!v.qty,location:!!v.location},log:[{t:n,who:actor(),text:'Enquiry logged from '+v.source+(linked?'. Linked to an existing customer.':'.')+' Index number '+enqNo+'.'}]};
 e.intakeScore=e.score=score(e);e.tier=tier(e);put('enquiries',e);S.sel=id;S.showDetail=true;toast(T('Created ')+enqNo)}
const C={
 lang(el){S.lang=el.value==='id'?'id':'en';try{localStorage.setItem('crm.lang',S.lang)}catch(e){}head();draw()},

 who(el){S.who=el.value;S.showDetail=false;keep();head();draw()},

 fStatus(el){S.fStatus=el.value;draw()},
 kyc(el,d){upE(d.id,e=>{e.kyc={...(e.kyc||{}),[d.k]:el.checked}},null,false)},
 pc(el,d){upE(d.id,e=>{e.priceCheck=el.checked},el.checked?'Moved to the price-check track: catalog price range only.':'Moved back to the normal track.',false)},
 po(el,d){upE(d.id,e=>{e.po={...(e.po||{}),[d.k]:el.checked}},null,false)},
 qEnq(el){S.q.enqId=el.value;draw()},
 qTpl(el){S.q.tpl=el.value;S.q.lines=[];draw()},

document.addEventListener('click',ev=>{popups().forEach(d=>{if(!d.contains(ev.target))d.open=false});const el=ev.target.closest('[data-a]');if(!el)return;const mn=el.closest('details.menu');if(mn)mn.open=false;const f=A[el.dataset.a];if(f){if(el.tagName==='A')ev.preventDefault();ev.stopPropagation();f(el.dataset,el)}});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el,el.dataset)});
document.addEventListener('input',ev=>{const el=ev.target.closest('[data-i]');if(el&&el.dataset.i==='filter'){S.filter=el.value;draw()}});

$('#modal').addEventListener('click',ev=>{if(ev.target.id==='modal')closeM()});

// Local server (server.js) speaks the same small db interface as the artifact: collection().onSnapshot, doc().onSnapshot, doc().set.
function serverDb(){
 const subs=[];let ver=-1,last=null;
 const snap=(path,cb)=>{const[c,id]=path.split('/');const d=last&&last[c]?last[c]:{};
  cb(id?{exists:id in d,data:()=>d[id]}:{docs:Object.entries(d).map(([k,v])=>({id:k,data:()=>v}))})};
 const poll=()=>fetch('api/data',{cache:'no-store'}).then(r=>{if(!r.ok)throw{code:'unavailable'};return r.json()}).then(j=>{if(j.ver===ver)return;ver=j.ver;last=j;subs.forEach(s=>snap(s.p,s.cb))});
 const sub=(p,cb,fail)=>{subs.push({p,cb});if(last)snap(p,cb);else poll().catch(e=>fail&&fail(e))};
 setInterval(()=>poll().catch(()=>{}),3000);// shortcut: 3 s polling, switch to server-sent events if it feels slow with many users
 return poll().then(()=>({
  collection:c=>({onSnapshot:(cb,fail)=>sub(c,cb,fail)}),
  doc:p=>({onSnapshot:(cb,fail)=>sub(p,cb,fail),
   set:doc=>fetch('api/doc/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)}).then(r=>r.ok?(ver=-1,poll()):r.json().then(j=>{throw{code:j.code||'error'}},()=>{throw{code:'error'}}))})
 }));
}
const use=window.claude&&typeof window.claude.use==='function'?window.claude.use('db'):location.protocol.startsWith('http')?serverDb().catch(()=>null):Promise.resolve(null);
setTimeout(()=>{if(!S.nodb&&!S.got.enquiries){S.slow=true;draw()}},10000);
use.then(db=>{if(!db){S.nodb=true;draw();return}S.db=db;
 const fail=e=>{if(!S.got.enquiries){S.nodb=true;S.db=null}toast((S.lang==='id'?'Pembaruan data bersama berhenti (':'Shared data stopped updating (')+((e&&e.code)||'error')+').');draw()};
 for(const col of['enquiries','requests','catalog'])db.collection(col).onSnapshot(s=>{const m=MAP[col]();m.clear();s.docs.forEach(d=>m.set(d.id,{...d.data(),id:d.id}));S.got[col]=1;draw()},fail);
 db.doc('meta/config').onSnapshot(s=>{S.cfg=s.exists?s.data():{};head();draw()},()=>{})
}).catch(()=>{S.nodb=true;draw()});
})();
