<meta name="claude:viewport-fit-sides" content="cover">
<title>Tradecorp CRM Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a depot gate board. Dark steel rail of views on the left, working yard on the right; index numbers set like container codes. */
:root{--bg:#f2f4f6;--panel:#ffffff;--ink:#15202b;--mute:#5a6775;--line:#dbe1e7;--rail:#0e2a44;--rail-ink:#c7d5e2;--rail-on:#1d4b75;--brand:#0f4c81;--brand-ink:#ffffff;--soft:#e6eef6;--ok:#17734a;--ok-bg:#e3f3ea;--warn:#8a5a00;--warn-bg:#fdf1d4;--bad:#b42d20;--bad-bg:#fbe6e3;--bar:#e3e8ed;--amber:#d99a2b;
--f-display:"Space Grotesk","Inter",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--panel:#172029;--ink:#e6ecf2;--mute:#97a5b3;--line:#2a3642;--rail:#0a1622;--rail-ink:#a9bccd;--rail-on:#1b456b;--brand:#5aa2e0;--brand-ink:#08131d;--soft:#1c2c3b;--ok:#5fd39b;--ok-bg:#143326;--warn:#f0c264;--warn-bg:#3a2e12;--bad:#ff8f82;--bad-bg:#40201c;--bar:#26323e;--amber:#e0a93b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151b;--panel:#172029;--ink:#e6ecf2;--mute:#97a5b3;--line:#2a3642;--rail:#0a1622;--rail-ink:#a9bccd;--rail-on:#1b456b;--brand:#5aa2e0;--brand-ink:#08131d;--soft:#1c2c3b;--ok:#5fd39b;--ok-bg:#143326;--warn:#f0c264;--warn-bg:#3a2e12;--bad:#ff8f82;--bad-bg:#40201c;--bar:#26323e;--amber:#e0a93b;color-scheme:dark}
*{box-sizing:border-box}
a{color:var(--brand)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
#app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
#rail{background:var(--rail);color:var(--rail-ink);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.logo{font-family:var(--f-display);font-weight:700;color:#fff;font-size:16px;letter-spacing:.4px;padding:0 8px 10px}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--rail-ink);letter-spacing:0}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--rail-ink)}
#nav button.on{background:var(--rail-on);color:#fff;font-weight:600}
#nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[data-a]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.who{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px 6px 0;border-top:1px solid #23415f;font-size:12px}
.who label{color:var(--rail-ink);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.who select{width:100%}
#main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:flex-end}
h1{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance;line-height:1.2}
h2{font-family:var(--f-display);font-size:15px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:baseline}
h2 small,.sub,.note{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.kpi{flex:1 1 130px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--mute)}.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .d{font-size:11.5px;color:var(--mute)}
.kpi.bad{background:var(--bad-bg);border-color:var(--bad)}.kpi.bad .v{color:var(--bad)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;color:var(--mute);font-weight:600;padding:6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.num td:not(:first-child),.num th:not(:first-child){text-align:center}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.2px;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--brand);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--bar);color:var(--mute)}
.t{display:inline-block;min-width:22px;text-align:center;border-radius:4px;font-weight:700;font-size:12px;padding:1px 4px;color:#fff}
.tA{background:#17734a}.tB{background:#b7791f}.tC{background:#7c8894}.tP{background:#7c8894}
button.b,a.b{all:unset;cursor:pointer;background:var(--brand);color:var(--brand-ink);padding:6px 11px;border-radius:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
button.b.g{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
button.b.s{padding:3px 8px;font-size:11.5px}
button.b.d{background:var(--bad);color:#fff}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.alert{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px}
.info{background:var(--warn-bg);border:1px solid var(--amber);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 32px;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.trk{display:flex;height:14px;background:var(--bar);border-radius:3px;overflow:hidden}.trk i{display:block;height:100%}
.sD{background:var(--brand)}.sO{background:var(--amber)}.sL{background:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px}
.hb b{text-align:right}
.days{display:flex;align-items:flex-end;gap:5px;height:110px;border-bottom:1px solid var(--line)}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute);min-width:0}
.days i{display:block;width:100%;background:var(--brand);border-radius:3px 3px 0 0;min-height:1px}
.days div.today i{background:var(--amber)}
.dlab{display:flex;gap:5px;font-size:11px;color:var(--mute);padding-top:3px}.dlab span{flex:1;text-align:center}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--bar);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lane h3{margin:0;font-size:13px;display:flex;justify-content:space-between;font-family:var(--f-display)}.lane h3 span{font-weight:400;color:var(--mute)}
.tk{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.tk.bad{border-left-color:var(--bad)}.tk.ok{border-left-color:var(--ok)}.tk.warn{border-left-color:var(--amber)}
.tk .f{display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between;color:var(--mute);font-size:11.5px}
.tk .acts{display:flex;flex-wrap:wrap;gap:4px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:5px 10px;font-size:13px}.kv span{color:var(--mute)}
.chk{list-style:none;margin:0;padding:0}.chk li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:13px}.chk li:last-child{border:0}
.chk b.p{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:6px 0 6px 14px;border-left:2px solid var(--line);position:relative;font-size:12.5px}
.tl li:before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.tl em{font-style:normal;color:var(--mute);margin-right:6px;white-space:nowrap}
.nf{display:inline-block;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:0 6px;font-weight:700;font-size:11px;margin-left:4px}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}.empty h1{color:var(--ink);margin-bottom:6px}
#modal{position:fixed;inset:0;background:rgba(8,16,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:20}
#mBox{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:min(100%,520px);padding:16px;display:flex;flex-direction:column;gap:10px}
.fr{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}.fr label{font-size:12px;color:var(--mute)}.fr.ck{flex-direction:row;align-items:center;gap:8px}.fr.ck label{font-size:13px;color:var(--ink)}
.fr input:not([type=checkbox]),.fr select,.fr textarea{width:100%}
.err{color:var(--bad);font-size:13px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:90vw}
@media (max-width:820px){#app{grid-template-columns:minmax(0,1fr)}#rail{padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));gap:8px}.logo{padding:0}#nav{flex-direction:row;overflow-x:auto;gap:4px}#nav button{white-space:nowrap}.who{margin:0;border:0;padding:0;flex-direction:row;flex-wrap:wrap;align-items:center}.who select{width:auto}.who label{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div id="app">
 <aside id="rail">
  <div class="logo">TRADECORP CRM<small>Working model &middot; dummy data</small></div>
  <nav id="nav" aria-label="Views"></nav>
  <div class="who">
   <label for="selRole">View as</label>
   <select id="selRole" data-c="role"></select>
   <select id="selWho" data-c="who" aria-label="Person or team"></select>
   <span id="clock"></span>
  </div>
 </aside>
 <main id="main"><div class="empty"><h1>Opening the yard</h1><p>Loading shared data&hellip;</p></div></main>
</div>
<div id="modal" hidden><div id="mBox" role="dialog" aria-modal="true" aria-labelledby="mT">
 <h2 id="mT"></h2><div id="mB"></div>
 <div class="row" style="justify-content:flex-end"><button class="b g" data-a="mX" id="mCancel">Cancel</button><button class="b" data-a="mOk" id="mOkBtn">Save</button></div>
</div></div>
<div id="toast" hidden role="status"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=36e5,D=864e5,TZ=7*H;

/* ---------- configuration (organisation, rules) ---------- */
const PEOPLE=[['GIL','Gilang','SBY','rm'],['ADI','Adi','SBY','sales'],['AND','Andri','SBY','sales'],['HEN','Pak Hendy','BPN','rm'],['NOV','Novi','BPN','sales'],['REV','Revita','BPN','sales'],['YUL','Yulianti','BPN','sales'],['DIN','Dini','JKT','rm'],['END','Enda','JKT','sales'],['EVI','Evi','JKT','sales'],['IVA','Ivan','JKT','sales'],['YOP','Yopi','JKT','sales'],['WEL','Welly','JKT','sales']].map(([code,name,region,role])=>({code,name,region,role}));
const P=Object.fromEntries(PEOPLE.map(p=>[p.code,p]));
const REGIONS={SBY:'Surabaya, Bali, NTB, Papua',BPN:'Balikpapan',JKT:'Jakarta'};
const DEPTS={Drafter:{days:3,cap:10},Estimator:{days:2,cap:8},Purchasing:{days:3},Trucking:{days:2},Depo:{days:1},Branch:{days:2},'Sales Support':{days:2}};
const DN=Object.keys(DEPTS);
const KYC=[['identity','Identity verified (person + company)',20],['repeat','Repeat customer',15],['need','Clear need, knows what they buy',15],['layout','Layout or drawing provided',15],['qty','Quantity known',10],['timeline','Timeline known',10],['location','Location known',5],['budget','Budget or decision maker known',10]];
const STATUS=['New','Contacted','Ongoing','No response','Won','Lost','Not prospectable'];
const OPEN=['New','Contacted','Ongoing','No response'];
const LOSS=['Price','Lead time','Specification','Competitor','Budget cancelled','No response'];
const SOURCES=['Central','Direct email','WhatsApp'];
const WON=['PO received','WO approval','WO / Kickoff','Production','Delivered','BAST signed','Handed to Finance'];
const PO=[['drawing','Customer-approved drawing (signed, email or verbal with who and when)'],['quote','Final quotation with revision number'],['match','PO matches the quote: items, qty, price'],['terms','PO terms clear: late penalty, warranty, delivery'],['timeline','Production timeline and delivery date'],['payment','Payment terms: DP, progress, on BAST']];
const SLA={contact:4,reassign:8,update:27,follow:9,lost:7,nofb:4,rmflag:9,dup:60};

/* ---------- state ---------- */
const S={db:null,nodb:false,got:{},enq:new Map(),req:new Map(),cat:new Map(),cfg:{},role:'sales',who:'ADI',tab:'desk',sel:null,selReq:null,live:false,filter:'',fStatus:'open',regionF:'',q:{enqId:'',tpl:'Sale',lines:[]},form:null};
try{const o=JSON.parse(localStorage.getItem('crm.view')||'null');if(o){S.role=o.role||S.role;S.who=o.who||S.who}}catch(e){}
const keep=()=>{try{localStorage.setItem('crm.view',JSON.stringify({role:S.role,who:S.who}))}catch(e){}};

/* ---------- time ---------- */
const now=()=>(!S.live&&S.cfg.demoNow)?+new Date(S.cfg.demoNow):Date.now();
const iso=t=>new Date(t).toISOString();
const w=t=>new Date(+new Date(t)+TZ);
const MON='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
const p2=n=>String(n).padStart(2,'0');
const fD=t=>{const d=w(t);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fT=t=>{const d=w(t);return fD(t)+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
const dayKey=t=>w(t).toISOString().slice(0,10);
const mtd=t=>dayKey(t).slice(0,7)===dayKey(now()).slice(0,7)&&+new Date(t)<=now();
const today=t=>dayKey(t)===dayKey(now());
/* business hours between two moments: Mon-Fri 08:00-17:00 WIB */
function biz(a,b){a=+new Date(a)+TZ;b=+new Date(b)+TZ;if(!(b>a))return 0;let t=0;for(let d=Math.floor(a/D)*D;d<b;d+=D){const wd=new Date(d).getUTCDay();if(wd===0||wd===6)continue;const s=Math.max(a,d+8*H),e=Math.min(b,d+17*H);if(e>s)t+=e-s}return t/H}
function addBizDays(t,n){let d=+new Date(t);while(n>0){d+=D;const wd=w(d).getUTCDay();if(wd!==0&&wd!==6)n--}return d}
const hrs=h=>h<1?Math.max(1,Math.round(h*60))+' m':h<9?h.toFixed(1)+' h':(h/9).toFixed(1)+' d';
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('en-US');
const rpS=n=>!n?'Rp 0':n>=1e9?'Rp '+(n/1e9).toFixed(1)+' bn':'Rp '+Math.round(n/1e6)+' m';
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';

/* ---------- rules ---------- */
const score=e=>Math.max(0,Math.min(100,KYC.reduce((s,[k,,p])=>s+(e.kyc&&e.kyc[k]?p:0),0)-10*(e.redFlags||0)));
const tier=e=>{if(e.priceCheck)return'P';const s=score(e);return s>=70?'A':s>=40?'B':'C'};
const tOrd={A:0,B:1,C:2,P:3};
const isOpen=e=>OPEN.includes(e.status);
function sla(e){const n=now();
 if(e.status==='New'){const h=biz(e.received,n);return h>SLA.reassign?{k:'reassign',t:'No contact for '+hrs(h),bad:1}:h>SLA.contact?{k:'breach',t:'No contact for '+hrs(h),bad:1}:{k:'ok',t:'Contact within '+hrs(SLA.contact-h)}}
 if(e.status==='No response'){const d=(n-+new Date(e.lastUpdate))/D;return d>=SLA.lost?{k:'autolost',t:'Silent '+Math.floor(d)+' days',bad:1}:{k:'ok',t:'Auto-lost in '+Math.ceil(SLA.lost-d)+' d'}}
 if(isOpen(e)){const h=biz(e.lastUpdate,n);if(e.stage==='Quote sent')return h>SLA.follow?{k:'followup',t:'Daily follow-up due',bad:1}:{k:'ok',t:'Follow-up logged'};return h>SLA.update?{k:'overdue',t:'Status update '+hrs(h-SLA.update)+' late',bad:1}:{k:'ok',t:'Update due in '+hrs(SLA.update-h)}}
 return{k:'closed',t:''}}
function rst(r){const n=now();
 if(r.status==='pending')return{b:'open',t:'Urgent: waiting for RM',cls:'warn'};
 if(r.status==='sent'){const h=biz(r.sentAt,n);return h>SLA.nofb?{b:'open',nofb:1,rm:h>SLA.rmflag,h,t:'No feedback for '+hrs(h),cls:'bad'}:{b:'open',h,t:'Awaiting accept',cls:'warn'}}
 if(r.status==='accepted')return n>+new Date(r.due)?{b:'late',t:'Late, was due '+fD(r.due),cls:'bad'}:{b:'open',t:'In progress, due '+fD(r.due),cls:'ok'};
 return{b:'done',t:r.status==='returned'?'Handed back':r.status==='rejected'?'Rejected':'Redirected to catalog',cls:''}}
const digits=s=>String(s||'').replace(/\D/g,'').replace(/^62/,'0');
const sameCust=(a,b)=>{const ea=(a.email||'').toLowerCase(),eb=(b.email||'').toLowerCase();if(ea&&ea===eb)return true;const pa=digits(a.phone),pb=digits(b.phone);if(pa.length>6&&pa===pb)return true;const ca=(a.customer||'').trim().toLowerCase(),cb=(b.customer||'').trim().toLowerCase();return!!ca&&ca===cb};
function mint(region,seller,t){const k=dayKey(t),yy=k.slice(2,4);let n=0;for(const e of S.enq.values()){const m=/^ENQ-([A-Z]+)-[A-Z]+-(\d{2})\d{4}-(\d+)$/.exec(e.enqNo||'');if(m&&m[1]===region&&m[2]===yy)n=Math.max(n,+m[3])}return`ENQ-${region}-${seller}-${k.slice(2).replace(/-/g,'')}-${String(n+1).padStart(4,'0')}`}

/* ---------- who is looking ---------- */
const me=()=>P[S.who];
const actor=()=>S.role==='support'?S.who:(me()?me().name:'Management');
const canW=()=>S.role!=='mgmt';
const inScope=x=>S.role==='sales'?x.seller===S.who:S.role==='rm'?x.region===me().region:S.role==='mgmt'?(!S.regionF||x.region===S.regionF):true;
const visE=()=>[...S.enq.values()].filter(inScope);
const visR=()=>[...S.req.values()].filter(r=>S.role==='support'?r.dept===S.who:inScope(r));
const sellersInScope=()=>PEOPLE.filter(p=>S.role==='sales'?p.code===S.who:S.role==='rm'?p.region===me().region:(!S.regionF||p.region===S.regionF));
const TABS={sales:[['desk','My Desk'],['enq','Enquiries'],['hub','My requests'],['work','My workload'],['quote','Quotations']],rm:[['region','Region control'],['work','Workload'],['inter','Interactions'],['enq','Enquiries'],['hub','Hand-off Hub'],['quote','Quotations']],mgmt:[['mgmt','All regions'],['work','Workload'],['inter','Interactions'],['enq','Enquiries'],['hub','Hand-off Hub']],support:[['hub','My queue']]};

/* ---------- storage ---------- */
const MAP={enquiries:()=>S.enq,requests:()=>S.req,catalog:()=>S.cat};
let raf=0;const draw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}
function put(col,doc){MAP[col]().set(doc.id,doc);draw();if(S.db)return S.db.doc(col+'/'+doc.id).set(doc).catch(e=>{toast('Not saved ('+((e&&e.code)||'error')+'). It shows on this screen only.')});return Promise.resolve()}
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function upE(id,fn,text,touch=true){const e=structuredClone(S.enq.get(id));if(fn)fn(e);const n=iso(now());if(touch)e.lastUpdate=n;if(text)(e.log=e.log||[]).unshift({t:n,who:actor(),text});e.score=score(e);e.tier=tier(e);return put('enquiries',e)}
function upR(id,fn,text){const r=structuredClone(S.req.get(id));if(fn)fn(r);if(text)(r.log=r.log||[]).unshift({t:iso(now()),who:actor(),text});return put('requests',r)}

const slaPill=e=>{const s=sla(e);return s.t?`<span class="pill ${s.bad?'bad':'ok'}">${esc(s.t)}</span>`:''};
const kpi=(l,v,d,bad)=>`<div class="kpi${bad?' bad':''}"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d||'&nbsp;'}</div></div>`;
const log=(a,n=8)=>`<ul class="tl">${(a||[]).slice(0,n).map(x=>`<li><em>${fT(x.t)}</em><b>${esc(x.who)}:</b> ${esc(x.text)}</li>`).join('')||'<li>No activity yet</li>'}</ul>`;
const regionSel=()=>S.role==='mgmt'?`<select data-c="regionF" id="regionF" aria-label="Region"><option value="">All regions</option>${Object.keys(REGIONS).map(r=>`<option${S.regionF===r?' selected':''}>${r}</option>`).join('')}</select>`:'';
const scopeName=()=>S.role==='sales'?me().name:S.role==='rm'?me().region+' region':S.regionF?S.regionF+' region':'All regions';
const enqRow=e=>`<tr class="click" data-a="open" data-id="${e.id}" tabindex="0"><td>${tChip(e)}</td><td class="mono">${esc(e.enqNo)}</td><td>${esc(e.customer)}</td><td>${esc(e.product)}</td><td>${stPill(e)}</td><td>${slaPill(e)}</td><td>${esc(e.seller)}</td></tr>`;
const enqTable=(a,empty)=>a.length?`<div class="scroll"><table><tr><th>Tier</th><th>Index no.</th><th>Customer</th><th>Product</th><th>Stage</th><th>SLA</th><th>Owner</th></tr>${a.map(enqRow).join('')}</table></div>`:`<p class="note">${empty}</p>`;
const sortE=a=>a.sort((x,y)=>(sla(y).bad?1:0)-(sla(x).bad?1:0)||tOrd[tier(x)]-tOrd[tier(y)]||+new Date(y.received)-+new Date(x.received));

 flag(d){upE(d.id,e=>{e.redFlags=Math.max(0,(e.redFlags||0)+(+d.n))},null,false)},
 toQuote(d){S.q={enqId:d.id,tpl:'Sale',lines:[]};S.tab='quote';S.showDetail=false;head();draw()},
 sendReq(d){const e=S.enq.get(d.id);form('Send a request to a team',[{k:'dept',label:'Team',type:'select',opts:DN},{k:'title',label:'What you need: product, size, quantity, site, special requirements',type:'area',req:1},{k:'catalog',label:'I checked the catalog and no standard design fits',type:'check'},{k:'urgent',label:'Urgent (next day). Needs RM approval',type:'check'}],v=>{
   const big=v.dept==='Drafter'||v.dept==='Estimator';
   if(big&&!(e.kyc&&e.kyc.identity))return'Identity gate: confirm the person, company and contact before asking the '+v.dept.toLowerCase()+'.';
   if(v.dept==='Drafter'){const t=tier(e);if(t==='C'||t==='P')return'Tier C and price-check enquiries use the catalog only.';if(!v.catalog)return'Check the catalog first, then tick the box.'}
   const id=nid('r'),n=iso(now());put('requests',{id,enqId:e.id,enqNo:e.enqNo,dept:v.dept,seller:e.seller,region:e.region,title:v.title,urgent:v.urgent,status:v.urgent?'pending':'sent',sentAt:n,nudges:0,log:[{t:n,who:actor(),text:'Request sent to '+v.dept+(v.urgent?'. Urgent, waiting for RM approval.':'.')}]});
   upE(e.id,x=>{if(big)x.stage=v.dept;if(x.status==='Contacted')x.status='Ongoing'},'Request sent to '+v.dept+': '+v.title)},'Minimum lead time: drafter 3 days, estimator 2 days. Incomplete requests are sent back.','Send request')},
 poSend(d){const e=S.enq.get(d.id),miss=PO.filter(([k])=>!(e.po&&e.po[k]));if(miss.length)return toast('Checklist incomplete: '+miss.length+' item(s) missing');upE(d.id,x=>{x.stage='WO approval'},'PO handover package sent to RM for approval.')},
 nextStage(d){const e=S.enq.get(d.id),nx=WON[WON.indexOf(e.stage)+1];upE(d.id,x=>{x.stage=nx},'Stage moved to '+nx+'.')},
 reassign(d){const to=$('#ra_'+d.id).value,e=S.enq.get(d.id);upE(d.id,x=>{x.firstOwner=x.firstOwner||x.seller;x.seller=to},`Reassigned from ${e.seller} to ${to}: no contact after ${SLA.reassign} business hours. Index number unchanged.`,false);[...S.req.values()].filter(r=>r.enqId===d.id).forEach(r=>upR(r.id,x=>{x.seller=to}))},
 closeLost(d){upE(d.id,x=>{x.status='Lost';x.lossReason='No response'},`Closed as lost: no response for ${SLA.lost} days. Can be reopened.`)},
 apprReq(d){upR(d.id,r=>{r.status='sent';r.rmApproved=true;r.sentAt=iso(now())},'Urgent request approved by RM. Sent to '+S.req.get(d.id).dept+'.')},
 rejReq(d){upR(d.id,r=>{r.status='rejected';r.reason='Urgent not approved'},'Urgent request not approved by RM. Resend with the normal lead time.')},
 apprPO(d){upE(d.id,x=>{x.stage='WO / Kickoff'},'PO package approved by RM. Work order and kickoff requested from Sales Support.');const e=S.enq.get(d.id),id=nid('r'),n=iso(now());put('requests',{id,enqId:e.id,enqNo:e.enqNo,dept:'Sales Support',seller:e.seller,region:e.region,title:'Work order and kickoff meeting',urgent:false,status:'sent',sentAt:n,nudges:0,log:[{t:n,who:actor(),text:'Work order and kickoff requested after RM approval.'}]})},
 rAccept(d){const r=S.req.get(d.id);upR(d.id,x=>{x.status='accepted';x.acceptedAt=iso(now());x.due=iso(addBizDays(now(),DEPTS[r.dept].days))},`Accepted by ${r.dept}. Due in ${DEPTS[r.dept].days} business day(s).`)},
 rReturn(d){const r=S.req.get(d.id);form('Hand back to sales',[{k:'note',label:'What you are handing back (drawing, price, schedule, answer)',type:'area',req:1}],v=>{upR(d.id,x=>{x.status='returned';x.returnedAt=iso(now())},'Handed back: '+v.note);const e=S.enq.get(r.enqId);if(e)upE(e.id,null,r.dept+' handed back: '+v.note,false)},null,'Hand back')},
 rReject(d){form('Reject this request',[{k:'reason',label:'Reason',type:'select',opts:['Unclear request','Missing information','Unrealistic timeline','Not in scope']},{k:'note',label:'What sales must fix',type:'area',req:1}],v=>{upR(d.id,x=>{x.status='rejected';x.reason=v.reason;x.returnedAt=iso(now())},`Rejected (${v.reason}): ${v.note}`)},null,'Reject')},
 rRedirect(d){upR(d.id,x=>{x.status='redirected';x.returnedAt=iso(now())},'Redirected to the drawing catalog: a standard design fits.')},
 rNudge(d){upR(d.id,x=>{x.nudges=(x.nudges||0)+1},'Nudge sent: please confirm status.');toast('Nudge logged')},
 rLog(d){const r=S.req.get(d.id);openM(r.dept+' request · '+r.enqNo,`<p style="margin-top:0">${esc(r.title)} <span class="pill ${rst(r).cls||'mute'}">${esc(rst(r).t)}</span></p>${log(r.log,20)}`)},
 qAdd(){const c=$('#qCat').value;if(c){S.q.lines.push({cat:c,qty:1});draw()}},
 qDel(d){S.q.lines.splice(+d.n,1);draw()},
 qSave(){const q=S.q,e=S.enq.get(q.enqId);if(!e)return toast('Choose an enquiry first');if(!q.lines.length)return toast('Add at least one line');const lines=q.lines.map(l=>{const c=S.cat.get(l.cat);return{item:c.item,qty:l.qty,price:c.price}}),total=lines.reduce((s,l)=>s+l.qty*l.price,0),rev=(e.quote?e.quote.rev:0)+1;
  upE(e.id,x=>{x.quote={tpl:q.tpl,rev,lines,total};x.stage='Quote sent';x.status='Ongoing';if(!x.contactedAt)x.contactedAt=iso(now())},`Quotation rev.${rev} (${q.tpl}) sent: ${rp(total)}.`);S.q={enqId:'',tpl:'Sale',lines:[]};toast('Quotation saved and marked as sent')}
};
function createEnq(v,linked){const p=P[v.seller],t=now(),id=nid('e'),enqNo=mint(p.region,p.code,t),n=iso(t);
 const e={id,enqNo,received:n,lastUpdate:n,source:v.source,customer:v.customer,contact:v.contact,phone:v.phone,email:v.email,line:v.line,type:v.type,product:v.product,location:v.location,qty:v.qty,region:p.region,seller:p.code,firstOwner:p.code,status:'New',stage:'New',redFlags:0,kyc:{identity:!!(v.customer&&v.contact&&(v.phone||v.email)),need:!!v.product,qty:!!v.qty,location:!!v.location},log:[{t:n,who:actor(),text:'Enquiry logged from '+v.source+(linked?'. Linked to an existing customer.':'.')+' Index number '+enqNo+'.'}]};
 e.intakeScore=e.score=score(e);e.tier=tier(e);put('enquiries',e);S.sel=id;S.showDetail=true;toast('Created '+enqNo)}
const C={
 role(el){S.role=el.value;S.tab=TABS[S.role][0][0];S.showDetail=false;S.regionF='';head();keep();draw()},
 who(el){S.who=el.value;S.showDetail=false;keep();head();draw()},
 regionF(el){S.regionF=el.value;draw()},
 fStatus(el){S.fStatus=el.value;draw()},
 kyc(el,d){upE(d.id,e=>{e.kyc={...(e.kyc||{}),[d.k]:el.checked}},null,false)},
 pc(el,d){upE(d.id,e=>{e.priceCheck=el.checked},el.checked?'Moved to the price-check track: catalog price range only.':'Moved back to the normal track.',false)},
 po(el,d){upE(d.id,e=>{e.po={...(e.po||{}),[d.k]:el.checked}},null,false)},
 qEnq(el){S.q.enqId=el.value;draw()},
 qTpl(el){S.q.tpl=el.value;S.q.lines=[];draw()},
 qQty(el,d){S.q.lines[+d.n].qty=Math.max(1,parseInt(el.value,10)||1);draw()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){if(el.tagName==='A')ev.preventDefault();ev.stopPropagation();f(el.dataset,el)}});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el,el.dataset)});
document.addEventListener('input',ev=>{const el=ev.target.closest('[data-i]');if(el&&el.dataset.i==='filter'){S.filter=el.value;draw()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#modal').hidden)closeM();if(ev.key==='Enter'&&ev.target.matches('tr.click'))ev.target.click()});
$('#modal').addEventListener('click',ev=>{if(ev.target.id==='modal')closeM()});

/* ---------- boot ---------- */
head();
const use=window.claude&&typeof window.claude.use==='function'?window.claude.use('db'):Promise.resolve(null);
setTimeout(()=>{if(!S.nodb&&!S.got.enquiries){S.slow=true;draw()}},10000);
use.then(db=>{if(!db){S.nodb=true;draw();return}S.db=db;
 const fail=e=>{if(!S.got.enquiries){S.nodb=true;S.db=null}toast('Shared data stopped updating ('+((e&&e.code)||'error')+').');draw()};
 for(const col of['enquiries','requests','catalog'])db.collection(col).onSnapshot(s=>{const m=MAP[col]();m.clear();s.docs.forEach(d=>m.set(d.id,{...d.data(),id:d.id}));S.got[col]=1;draw()},fail);
 db.doc('meta/config').onSnapshot(s=>{S.cfg=s.exists?s.data():{};head();draw()},()=>{})
}).catch(()=>{S.nodb=true;draw()});
})();
</script>
