{% extends "base.html" %}{% from "_m.html" import csrf %}
{% block main %}
<h1>Ganti password</h1>
<form method="post" class="card" style="max-width:420px;display:flex;flex-direction:column;gap:10px">{{ csrf() }}
 <div class="fr"><label for="o">Password lama</label><input id="o" name="old" type="password" required></div>
 <div class="fr"><label for="n">Password baru (min. 8 karakter)</label><input id="n" name="new" type="password" minlength="8" required></div>
 <button class="b">Simpan</button>
</form>
{% endblock %}
